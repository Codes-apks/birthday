<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050509">
<title>С Днём рождения! 🎉</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="particles"></div>

<main id="loading">

    <div class="loader"></div>

    <div id="status">Инициализация...</div>

    <div class="sub" id="sub">
        Подожди немного...
    </div>

</main>


<main id="birthday" class="hidden">

    <div class="cake">🎂</div>

    <h1>
        С ДНЁМ<br>
        <span>РОЖДЕНИЯ!</span>
    </h1>

    <div class="line"></div>

    <p>
        Сегодня тот самый день,
        <br>
        когда можно официально
        <br>
        забыть про все дела.
    </p>

    <p>
        Желаю тебе:
        <br>
        много счастья,
        <br>
        денег без счёта,
        <br>
        приключений без последствий
        <br>
        и побольше поводов
        <br>
        улыбаться. 
    </p>

    <p class="gold">
        Пусть этот год будет
        <br>
        <b>ЕЩЁ КРУЧЕ.</b> 🚀
    </p>

    <div class="signature">
        Дальше - боль(ше)❤️ <br>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#090914">

    <title>С Днём рождения! 🎉</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 16px;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #302060 0%,
                    transparent 38%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #142c58 0%,
                    transparent 38%
                ),
                #090914;

            color: #ffffff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        /* ЗВЁЗДЫ */

        .stars {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.8) 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    rgba(255,255,255,.5) 1px,
                    transparent 1px
                );

            background-size:
                90px 90px,
                130px 130px;

            background-position:
                0 0,
                40px 70px;

            opacity: .3;
        }

        /* КАРТОЧКА */

        .card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 440px;

            padding: 38px 28px;

            text-align: center;

            border-radius: 30px;

            background: rgba(30, 30, 55, .88);

            border: 1px solid rgba(255,255,255,.18);

            box-shadow:
                0 25px 90px rgba(0,0,0,.65),
                inset 0 1px 0 rgba(255,255,255,.08);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: cardAppear .8s ease both;
        }

        /* ЗАГРУЗКА */

        #loading {
            min-height: 180px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: #ffffff;
        }

        .loader {
            font-size: 58px;

            margin-bottom: 20px;

            animation:
                cakeFloat 2s ease-in-out infinite;
        }

        #status {
            font-size: 21px;
            font-weight: 700;

            color: #ffffff;
        }

        #sub {
            margin-top: 10px;

            font-size: 14px;

            color: rgba(255,255,255,.55);
        }

        /* ПОЗДРАВЛЕНИЕ */

        #birthday {
            animation: birthdayIn .9s cubic-bezier(.2,.8,.2,1) both;
        }

        .hidden {
            display: none !important;
        }

        /* ТОРТ */

        .cake {
            display: block;

            font-size: 72px;

            line-height: 1;

            margin-bottom: 18px;

            animation:
                cakeFloat 2.5s ease-in-out infinite;
        }

        /* ЗАГОЛОВОК */

        h1 {
            margin: 0 0 20px;

            font-size: clamp(34px, 10vw, 54px);

            line-height: .95;

            letter-spacing: -2px;

            font-weight: 900;

            color: #ffffff;
        }

        h1 span {
            color: #ffd447;

            text-shadow:
                0 0 30px rgba(255,212,71,.35);
        }

        /* ЛИНИЯ */

        .line {
            width: 65px;
            height: 3px;

            margin: 0 auto 24px;

            border-radius: 10px;

            background: #ffd447;

            box-shadow:
                0 0 15px rgba(255,212,71,.5);
        }

        /* ТЕКСТ */

        p {
            margin: 0 0 20px;

            font-size: clamp(16px, 4.5vw, 18px);

            line-height: 1.55;

            color: rgba(255,255,255,.86);
        }

        .gold {
            color: #ffd447;
        }

        .gold b {
            font-size: 1.15em;
            color: #ffd447;
        }

        /* ПОДПИСЬ */

        .signature {
            margin-top: 28px;
            padding-top: 20px;

            border-top:
                1px solid
                rgba(255,255,255,.12);

            font-size: 13px;

            line-height: 1.5;

            color: rgba(255,255,255,.55);
        }

        /* КОНФЕТТИ */

        .confetti {
            position: fixed;

            top: -40px;

            z-index: 100;

            pointer-events: none;

            font-size: 22px;

            animation:
                fall linear forwards;
        }

        /* АНИМАЦИИ */

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(.94);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes birthdayIn {
            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    scale(.92);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes cakeFloat {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(3deg);
            }
        }

        @keyframes fall {
            to {
                transform:
                    translateY(115vh)
                    translateX(var(--x))
                    rotate(720deg);
            }
        }

        /* ТЕЛЕФОН */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 30px 20px;

                border-radius: 26px;
            }

            .loader {
                font-size: 54px;
            }

            .cake {
                font-size: 62px;
            }

            h1 {
                font-size: 36px;
            }

            p {
                font-size: 16px;
            }
        }

        /* НИЗКИЙ ЭКРАН */

        @media (max-height: 700px) {

            body {
                align-items: flex-start;

                padding-top: 15px;
                padding-bottom: 15px;
            }

            .card {
                padding: 24px 18px;

                margin-top: 0;
                margin-bottom: 0;
            }

            .cake {
                font-size: 52px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 15px;
            }

            .line {
                margin-bottom: 18px;
            }

            p {
                margin-bottom: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <main class="card">

        <!-- ЗАГРУЗКА -->

        <section id="loading">

            <div class="loader">
                🎂
            </div>

            <div id="status">
                Приготовься...
            </div>

            <div id="sub">
                Тут кое-что для тебя ✨
            </div>

        </section>


        <!-- ПОЗДРАВЛЕНИЕ -->

        <section id="birthday" class="hidden">

            <div class="cake">
                🎂
            </div>

            <h1>
                С ДНЁМ<br>
                <span>РОЖДЕНИЯ!</span>
            </h1>

            <div class="line"></div>

            <p>
                Сегодня тот самый день,
                <br>
                когда можно официально
                <br>
                забыть про все дела.
            </p>

            <p>
                Желаю тебе много счастья,
                <br>
                денег без счёта,
                <br>
                приключений без последствий
                <br>
                и побольше поводов
                <br>
                улыбаться. 
            </p>

            <p class="gold">
                Пусть этот год будет
                <br>
                <b>ЕЩЁ КРУЧЕ.</b> 🚀
            </p>

            <div class="signature">
                Дальше - боль(ше)❤️ <br>
            </div>

        </section>

    </main>


    <script>
        const loading =
            document.getElementById("loading");

        const birthday =
            document.getElementById("birthday");

        const status =
            document.getElementById("status");

        const sub =
            document.getElementById("sub");


        /* ЭТАП 1 */

        setTimeout(() => {

            status.textContent =
                "Готовлю поздравление...";

            sub.textContent =
                "Ещё секундочку ✨";

        }, 1200);


        /* ЭТАП 2 */

        setTimeout(() => {

            status.textContent =
                "Почти готово...";

            sub.textContent =
                "🎂🎉";

        }, 2400);


        /* ЭТАП 3 */

        setTimeout(() => {

            loading.classList.add("hidden");

            birthday.classList.remove("hidden");

            fireworks();

            if (navigator.vibrate) {

                navigator.vibrate([
                    80,
                    50,
                    80,
                    50,
                    200
                ]);

            }

        }, 3500);


        /* КОНФЕТТИ */

        function fireworks() {

            const emojis = [
                "🎉",
                "🎊",
                "✨",
                "⭐",
                "🥳",
                "🎈",
                "💫",
                "🎂"
            ];

            for (let i = 0; i < 80; i++) {

                const el =
                    document.createElement("div");

                el.className =
                    "confetti";

                el.textContent =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];

                el.style.left =
                    Math.random() * 100 + "vw";

                el.style.setProperty(
                    "--x",
                    (-150 +
                        Math.random() * 300) +
                    "px"
                );

                el.style.animationDuration =
                    (2.5 +
                        Math.random() * 3) +
                    "s";

                el.style.animationDelay =
                    Math.random() * .8 + "s";

                document.body.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 6500);
            }
        }
    </script>

</body>
</html>

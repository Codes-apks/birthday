<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#090914">

    <title>С Днём рождения! 🎉</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>

<div class="card">

    <!-- ЭКРАН ЗАГРУЗКИ -->

    <div id="loading">

        <div class="loader">✨</div>

        <div id="status">
            Приготовься...
        </div>

        <div id="sub">
            Тут кое-что для тебя
        </div>

    </div>


    <!-- ПОЗДРАВЛЕНИЕ -->

    <div id="birthday" class="hidden">

        <div class="cake">
            🎂
        </div>

        <h1>
            С ДНЁМ<br>
            <span>РОЖДЕНИЯ!</span>
        </h1>

        <div class="line"></div>

        <p>
            Сегодня тот самый день,
            <br>
            когда можно официально
            <br>
            забыть про все дела.
        </p>

        <p>
            Желаю тебе много счастья,
            <br>
            денег без счёта,
            <br>
            приключений без последствий
            <br>
            и побольше поводов
            <br>
            улыбаться. 
        </p>

        <p class="gold">
            Пусть этот год будет
            <br>
            <b>ЕЩЁ КРУЧЕ.</b> 🚀
        </p>

        <div class="signature">
            Дальше - боль(ше)❤️ <br>
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
